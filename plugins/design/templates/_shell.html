<!doctype html>
<!--
  _shell.html — shared canvas mount harness (DDR-019, Phase 3.6).

  How it works:
    1. The dev-server's TSX-canvas iframe loads this file with
         ?canvas=<path-relative-to-designRoot>
       (e.g. ?canvas=ui/Docs%20Site.tsx).
    2. The importmap below resolves "react", "react-dom/client",
       "react/jsx-runtime", "react/jsx-dev-runtime" against the four
       /_canvas-runtime/*.js bundles served by the dev-server. The browser
       only fetches each bundle once — every canvas in the session shares them.
    3. The canvas TSX module is fetched from the same path under designRoot.
       The dev-server's /<designRel>/ui/<slug>.tsx route runs canvas-pipeline
       (data-cd-id injection) then Bun.build (browser-loadable ESM) and serves
       the result with Content-Type application/javascript.
    4. We grab the default export, wrap it in React's createRoot, and render
       into <div id="canvas-root">. The token + component CSS files load
       cooperatively — same href as for legacy .html canvases, so the visual
       contract is identical.

  This file is part of the plugin distribution; the dev-server serves it
  directly from plugins/design/templates/. It is intentionally NOT copied
  into <designRoot> — the dev-server is its single source of truth.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Canvas</title>
    <script>
      // T2 (9.1 / DDR-060 F1 re-audit) — best-effort WebRTC denial in the canvas
      // iframe. CSP `webrtc 'block'` is specified but UNIMPLEMENTED in shipping
      // Chrome/Firefox as of 2026 (Chromium #40188662, Firefox bug 1783489), so
      // it is currently a no-op, and `connect-src 'self'` does NOT cover WebRTC
      // (it is not Fetch). Hub-pushed canvas JS could otherwise exfil via
      // ICE/STUN. Locking these to undefined raises the bar against the naive
      // case before any canvas module loads. NOT bulletproof — a nested
      // same-origin (about:blank) frame can re-acquire them — so WebRTC exfil
      // stays a DOCUMENTED residual of opt-in linked mode (see the linked-mode
      // README banner). `webrtc 'block'` stays in the CSP for when browsers
      // enforce it. The canvas runtime itself uses zero WebRTC.
      for (var __k of ['RTCPeerConnection', 'webkitRTCPeerConnection', 'RTCDataChannel']) {
        try {
          Object.defineProperty(window, __k, { value: undefined, configurable: false, writable: false });
        } catch (_) {
          /* already locked / not present */
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      html, body, #canvas-root { height: 100%; margin: 0; }
      body { background: var(--u-bg-0, #fff); }
      #canvas-mount-error {
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 16px 20px;
        color: #b91c1c;
        background: #fff5f5;
        white-space: pre-wrap;
      }
      #canvas-mount-error:empty { display: none; }
    </style>
    <!-- Phase 6.5 export — when the shell is loaded with `&hide-chrome=1`
         (the exporters set this), suppress every dev-server overlay so the
         capture only carries the artboard content. The runtime chrome — tool
         palette, mini-map, presence avatars + cursors, comment pins, draw
         layer, snap guides, selection halos, toolbars, the artboard label
         button — is not part of the design and would otherwise leak into PNG /
         PDF / SVG exports. The selector list MUST track the live class names:
         the previous list referenced `.dc-mini-map` / `.dc-world-map`, which
         never existed (the real minimap is `.dc-mm`), and omitted the presence
         avatars `.dc-participants`, so both leaked — see export-pipeline-fixes
         Task 2. The bootstrap below flips this block's `media` from `not all`
         to `all` only when `?hide-chrome=1`, so the live editor keeps chrome. -->
    <style id="canvas-hide-chrome" media="not all">
      /* Minimap + zoom + tool palette (and its portaled popovers) */
      .dc-mm,
      .dc-zoom-tb,
      .dc-tool-palette,
      .dc-tp-popover,
      .dc-tp-shape-popover,
      .dc-context-menu,
      /* Presence — avatars (top-right) + live cursors */
      .dc-participants,
      .dc-cursor-overlay,
      /* Selection + manipulation chrome */
      .dc-cv-halo,
      .dc-cv-group-bbox,
      .dc-cv-eq-spacing-layer,
      .dc-multi-artboard-tb,
      .dc-elem-ctx-tb,
      .dc-snap-guide,
      .dc-snap-pill,
      /* Annotations (FigJam-style draw layer) */
      .dc-annot-svg,
      .dc-annot-ctx,
      .dc-annot-resize-handle,
      /* Comments — pins, threads, composer, @mention popup */
      .cm-layer,
      .cm-pin,
      .cm-thread,
      .cm-composer,
      .cm-mention-popup,
      /* Inspector pin overlay injected into every served shell (inspect.ts) */
      .dgn-pin,
      #dgn-pin-layer,
      /* HUDs + banners */
      .dc-ai-banner,
      .dc-undo-hud,
      /* Activity overlay — live "agent works here" chrome (Phase 13 / DDR-029) */
      .dc-activity-rim,
      /* HMR "holding last good" toast (Phase 13.1 / DDR-077) */
      .dc-hmr-holding,
      /* Artboard title/label button (editor affordance, not design content) */
      .dc-artboard-label,
      /* Generic opt-in hooks for any future floating overlay */
      [data-dc-overlay],
      [data-mdcc-annotations] { display: none !important; }
    </style>
    <!-- Tokens + DS component CSS — loaded by the host app via the canvas's
         .meta.json (set later via window.parent postMessage, OR by the dev-
         server when it knows the active DS). For now we load both common
         paths; one will 404 silently per DS depending on layout. -->
    <link id="canvas-tokens" rel="stylesheet" href="" data-canvas-css="tokens" />
    <link id="canvas-components" rel="stylesheet" href="" data-canvas-css="components" />
    <script type="importmap">
      {
        "imports": {
          "react": "/_canvas-runtime/react.js",
          "react-dom": "/_canvas-runtime/react-dom.js",
          "react-dom/client": "/_canvas-runtime/react-dom_client.js",
          "react/jsx-runtime": "/_canvas-runtime/react_jsx-runtime.js",
          "react/jsx-dev-runtime": "/_canvas-runtime/react_jsx-dev-runtime.js",
          "pixi.js": "/_canvas-runtime/pixi-js.js",
          "motion": "/_canvas-runtime/motion.js",
          "motion/react": "/_canvas-runtime/motion_react.js",
          "yjs": "/_canvas-runtime/yjs.js",
          "y-protocols/sync": "/_canvas-runtime/y-protocols_sync.js",
          "y-protocols/awareness": "/_canvas-runtime/y-protocols_awareness.js",
          "lib0/decoding": "/_canvas-runtime/lib0_decoding.js",
          "lib0/encoding": "/_canvas-runtime/lib0_encoding.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="canvas-root"></div>
    <pre id="canvas-mount-error"></pre>

    <script type="module">
      const params = new URLSearchParams(location.search);
      const designRel = (params.get('designRel') || '.design').replace(/^\/+|\/+$/g, '');
      // Callers may pass paths either relative to designRoot (`ui/Foo.tsx` — the
      // canonical contract) OR repo-relative (`.design/ui/Foo.tsx` — the form
      // `_active.json` stores). Normalize to the canonical form so we never
      // emit `/.design/.design/...` import URLs and 404 silently.
      const stripDesignPrefix = (p) => {
        if (!p) return p;
        const s = p.replace(/^\/+/, '');
        return s.startsWith(designRel + '/') ? s.slice(designRel.length + 1) : s;
      };
      const canvasRel = stripDesignPrefix(params.get('canvas'));
      const tokensRel = stripDesignPrefix(params.get('tokens') || '');
      const componentsRel = stripDesignPrefix(params.get('components') || '');
      const layoutRel = stripDesignPrefix(params.get('layout') || '');

      // Phase 13.1 / DDR-077 — error-resilient HMR while an agent edits. Hoisted
      // here so the HMR client (below) can soft-reload the canvas module instead
      // of location.reload()-ing into a half-saved (broken) build.
      const canvasUrl = canvasRel ? ('/' + designRel + '/' + canvasRel) : null;
      const myFileKey = canvasRel ? (designRel + '/' + canvasRel) : null;
      // True while an `ai-activity` entry is live for THIS canvas (an agent is
      // running /design:edit|new on it). Mirrors ai-banner's gate: parent relays
      // ai-activity via postMessage when embedded; the own-WS path (standalone /
      // same-origin inspector socket) is handled in connectHmr below.
      let agentEditing = false;
      window.addEventListener('message', (e) => {
        // DDR-078 security follow-up: only the trusted embedding parent relays
        // ai-activity. Reject canvas self-posts (which could flip the HMR gate)
        // and any non-parent source. Standalone gets it via its own WS below.
        if (e.source !== window.parent || window.parent === window) return;
        const m = e && e.data;
        if (!m || typeof m !== 'object' || m.dgn !== 'ai-activity') return;
        if (myFileKey && m.file === myFileKey) agentEditing = !!m.entry;
      });

      // Soft reload — re-import the canvas module (cache-busted) and swap it in
      // via the runtime, holding the last good render on a build/import error
      // (no white flash). Only used when an agent is editing; manual edits keep
      // the plain location.reload() below.
      function softReload(version) {
        if (!canvasUrl) { location.reload(); return; }
        const rt = window.__maudeCanvasRuntime;
        if (!rt || !rt.remount) { location.reload(); return; }
        import(canvasUrl + '?v=' + (version || Date.now()))
          .then((mod) => {
            if (mod && typeof mod.default === 'function') {
              rt.remount(mod.default);
              if (rt.setHolding) rt.setHolding(false);
            } else {
              // No usable default export (rare) — fall back to a hard reload.
              location.reload();
            }
          })
          .catch((err) => {
            // Build/transpile/import error → keep the current render, surface a
            // non-destructive "holding" toast. Next good build swaps it in.
            if (rt.setHolding) rt.setHolding(true, (err && (err.message || String(err))) || 'build error');
            console.warn('[canvas-shell] soft-reload held last good (build error):', err);
          });
      }
      // Phase 6.5 — exporters pass ?hide-chrome=1 to flip the export-mode
      // stylesheet from `media="not all"` to `media="all"`, hiding the
      // dev-server overlays during capture. See `<style id="canvas-hide-chrome">`.
      if (params.get('hide-chrome') === '1') {
        const styleEl = document.getElementById('canvas-hide-chrome');
        if (styleEl) styleEl.media = 'all';
      }
      // Shell-owned comment layer toggle. Gallery thumbnails pass `?comments=0`
      // so the comment chrome is suppressed in previews; opened tabs omit it
      // (comments on). hide-chrome exports also suppress comments.
      const commentsEnabled = params.get('comments') !== '0' && params.get('hide-chrome') !== '1';

      function showError(msg) {
        const el = document.getElementById('canvas-mount-error');
        if (el) el.textContent = msg;
        console.error('[canvas-shell]', msg);
      }

      // ---------------------------------------------------------------------
      // HMR client — listens for `canvas-hmr` messages on /_ws. Three modes:
      //   - css: swap <link> href with ?v=<version> cache bust.
      //   - module: location.reload() — the canvas module re-fetches.
      //   - hard: location.reload() — _lib/* changed, everything re-bundles.
      // The WS connection retries on close (dev-server restart resilience).
      function connectHmr() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(proto + '://' + location.host + '/_ws');
        ws.addEventListener('message', (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (!msg) return;
            // Phase 13.1 / DDR-077 — own-WS path for the agent-active gate (this
            // socket is the inspector channel in standalone / same-origin mode;
            // embedded canvas-hmr sockets get ai-activity via the parent's
            // postMessage relay handled above).
            if (msg.type === 'ai-activity') {
              if (myFileKey && msg.file === myFileKey) agentEditing = !!msg.entry;
              return;
            }
            // Phase 13 / DDR-029 — canvas activity overlay. The server pushes
            // `{ type:'activity', file, status, artboard_ids, ts }` as edits land
            // + go idle; the injected runtime (use-canvas-activity.tsx) listens
            // for the `maude:activity` document event. Same-document bridge — no
            // second socket. The `snapshot` seed re-plays the activity map for a
            // tab that opens mid-edit (inspector-origin only).
            if (msg.type === 'activity') {
              // Maintain a running activity seed (shape matches the snapshot's
              // `activity.state`: camelCase artboardIds). Load-bearing for the
              // Phase 13.1 soft-reload: a soft remount resets the activity
              // provider WITHOUT a page reload (so no fresh snapshot), and the
              // provider re-seeds from this map — without it the overlay would
              // vanish on every agent .tsx save.
              if (!window.__maude_activity_seed__) window.__maude_activity_seed__ = {};
              if (msg.status === 'active') {
                window.__maude_activity_seed__[msg.file] = {
                  status: 'active', artboardIds: msg.artboard_ids || null, ts: msg.ts,
                };
              } else {
                delete window.__maude_activity_seed__[msg.file];
              }
              document.dispatchEvent(new CustomEvent('maude:activity', { detail: msg }));
              return;
            }
            if (msg.type === 'snapshot' && msg.activity && typeof msg.activity === 'object') {
              // Stash so the provider can seed on mount even if it isn't listening
              // yet (the snapshot can arrive before React mounts — a real race
              // after the HMR reload that a canvas edit triggers). Also dispatch
              // for any provider that IS already mounted (same-origin live case).
              window.__maude_activity_seed__ = msg.activity;
              for (const file in msg.activity) {
                const e = msg.activity[file];
                if (!e) continue;
                document.dispatchEvent(new CustomEvent('maude:activity', {
                  detail: { type: 'activity', file: file, status: e.status, artboard_ids: e.artboardIds || null, ts: e.ts },
                }));
              }
              return;
            }
            if (msg.type !== 'canvas-hmr') return;
            if (msg.mode === 'css') {
              const v = msg.version || Date.now();
              // Match by exact filename when we have one; otherwise refresh all.
              const targetFile = (msg.file || '').split('/').pop();
              let matched = false;
              for (const link of document.querySelectorAll('link[rel="stylesheet"]')) {
                const href = link.getAttribute('href') || '';
                if (!targetFile || href.includes(targetFile)) {
                  const base = href.split('?')[0];
                  link.setAttribute('href', base + '?v=' + v);
                  matched = true;
                }
              }
              // A per-canvas `<slug>.css` imported by the TSX is INLINED into the
              // canvas module as a <style> by Bun.build — there is no <link> to
              // swap, so the loop above matches nothing and the edit is silently
              // dropped until a manual hard-reload (RCA hmr-inlined-css-dropped).
              // When nothing matched AND the changed CSS lives in THIS canvas's
              // directory, reload so the rebuilt module re-inlines the fresh CSS.
              // Scoped to same-dir so an unrelated specimen's CSS write doesn't
              // reload every open tab.
              if (!matched && msg.file && canvasRel) {
                const cssDir = msg.file.replace(/[^/]+$/, '');
                const canvasDir = canvasRel.replace(/[^/]+$/, '');
                if (cssDir === canvasDir) location.reload();
              }
            } else if (msg.mode === 'module' || msg.mode === 'hard') {
              // Only reload when the change touches *this* canvas (or `_lib`).
              if (msg.mode === 'hard' || !msg.file || (canvasRel && msg.file === canvasRel)) {
                // Phase 12.3 — CSS-panel echo guard. The panel applies each
                // edit optimistically to the live DOM (dgn:'apply-style'), so a
                // `module` reload for THIS canvas's own edit is redundant churn:
                // it remounts the canvas, drops the selection halo, and flickers
                // the iframe. Skip it within a short window of a self-applied
                // optimistic style. `hard` (_lib rebuild) is global — never
                // skipped. Mirrors the meta echo-guard below.
                if (msg.mode === 'module') {
                  const lastOpt = window.__maude_last_css_optimistic_at || 0;
                  if (Date.now() - lastOpt < 1500) return;
                }
                // Phase 13.1 / DDR-077 — when an agent is live-editing, soft-
                // reload (hold last good on a broken intermediate). Manual edits
                // (or no runtime yet) keep the plain, immediate hard reload.
                if (agentEditing && window.__maudeCanvasRuntime && window.__maudeCanvasRuntime.remount) {
                  softReload(msg.version);
                } else {
                  location.reload();
                }
              }
            } else if (msg.mode === 'meta') {
              // Phase 8 — canvas-meta sidecar changed. Filter to our own canvas:
              // `<canvasRel>.meta.json` strip → must equal canvasRel without ext.
              if (!canvasRel || !msg.file) return;
              const metaBase = msg.file.replace(/\.meta\.json$/i, '');
              const myBase = canvasRel.replace(/\.(tsx|html)$/i, '');
              if (metaBase !== myBase) return;
              // Echo guard — when WE just PATCHed the meta, skip the round-trip.
              const lastSelf = (window).__maude_last_meta_self_write_at || 0;
              if (Date.now() - lastSelf < 2000) return;
              // Re-fetch + broadcast to the canvas via window event. canvas-lib
              // listens for `maude:meta-refreshed` and re-applies layout +
              // viewport in-place (no full reload — preserves tool / undo state).
              const metaFileParam = encodeURIComponent(designRel + '/' + canvasRel);
              fetch('/_api/canvas-meta?file=' + metaFileParam, {
                headers: { 'Cache-Control': 'no-store' },
              })
                .then((r) => (r.ok ? r.json() : null))
                .then((j) => {
                  if (!j || typeof j !== 'object') return;
                  window.__canvas_meta__ = j;
                  document.dispatchEvent(new CustomEvent('maude:meta-refreshed', { detail: j }));
                })
                .catch(() => {
                  /* network blip — next interaction will retry */
                });
            }
          } catch (e) {
            console.warn('[canvas-shell] HMR message parse error', e);
          }
        });
        ws.addEventListener('close', () => {
          // Reconnect after a beat — dev-server may have restarted.
          setTimeout(connectHmr, 750);
        });
      }
      connectHmr();

      if (!canvasRel) {
        showError('Missing ?canvas= query parameter. Add ?canvas=ui/<slug>.tsx.');
      } else {
        if (tokensRel) document.getElementById('canvas-tokens').href = '/' + designRel + '/' + tokensRel;
        if (componentsRel) document.getElementById('canvas-components').href = '/' + designRel + '/' + componentsRel;
        if (layoutRel) {
          // Inject a third <link> for the DS layout chrome (specimens load this).
          const layoutLink = document.createElement('link');
          layoutLink.rel = 'stylesheet';
          layoutLink.href = '/' + designRel + '/' + layoutRel;
          layoutLink.dataset.canvasCss = 'layout';
          document.head.appendChild(layoutLink);
        }

        // canvasUrl is hoisted above (Phase 13.1) so the HMR soft-reload can use it.
        // Phase 4 T5 — read the canvas's sibling .meta.json and stash it on
        // window so DesignCanvas can seed `layout` + `viewport` synchronously.
        // The fetch runs in parallel with imports; failure is non-fatal (the
        // canvas falls through to default grid + fit-to-screen).
        const metaFileParam = encodeURIComponent(designRel + '/' + canvasRel);
        // Phase 8 — expose designRel + canvasRel-without-prefix on window so
        // collab-slug derivation can strip the prefix consistently with
        // server-side api.fileSlug (which trims paths.designRel).
        window.__canvas_design_rel__ = designRel;
        window.__canvas_rel__ = canvasRel;
        const metaFetch = fetch('/_api/canvas-meta?file=' + metaFileParam, {
          headers: { 'Cache-Control': 'no-store' },
        })
          .then((r) => (r.ok ? r.json() : null))
          .then((j) => {
            window.__canvas_meta__ = (j && typeof j === 'object') ? j : {};
            window.__canvas_meta_file__ = designRel + '/' + canvasRel;
          })
          .catch(() => {
            window.__canvas_meta__ = {};
            window.__canvas_meta_file__ = designRel + '/' + canvasRel;
          });
        try {
          // mountCanvas (dist/comment-mount.js) owns the React root + the lite
          // comment provider tree. It externalizes react / react-dom/client to
          // the importmap so the canvas module and the comment layer share one
          // React singleton (inlining a second React would break hooks).
          const [{ mountCanvas }, mod] = await Promise.all([
            import('/_client/comment-mount.js'),
            import(canvasUrl),
            metaFetch,
          ]);
          const Canvas = mod.default;
          if (typeof Canvas !== 'function') {
            throw new Error(
              'Canvas module at ' + canvasUrl + ' has no default export (or it is not a component).'
            );
          }
          const rootEl = document.getElementById('canvas-root');
          mountCanvas(Canvas, {
            rootEl,
            file: designRel + '/' + canvasRel,
            commentsEnabled,
          });
          // T2 (9.1-A) diagnostic — tell the parent the canvas mounted + how many
          // root children it rendered. Lets the shell (and tooling) confirm a
          // cross-origin canvas actually rendered, which a parent-page screenshot
          // of an OOPIF cannot show. Harmless heartbeat; ignored if unhandled.
          setTimeout(() => {
            try {
              window.parent.postMessage(
                { dgn: 'canvas-mounted', file: designRel + '/' + canvasRel, children: rootEl ? rootEl.children.length : 0 },
                '*'
              );
            } catch (e) { /* parent gone */ }
          }, 800);
        } catch (err) {
          showError((err && err.stack) || String(err));
        }
      }
    </script>
  </body>
</html>
