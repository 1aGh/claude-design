<!doctype html>
<html lang="en" class="mdcc" data-theme="light">
<head>
<meta charset="utf-8">
<title>Docs Site — MDCC-DSN/01 · marketplace landing + standalone docs</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../system/project/colors_and_type.css">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  /* ─── Artboard base — paper stock, mono everywhere ─────────────────── */
  .ab {
    width: 100%;
    height: 100%;
    background: var(--bg-0);
    color: var(--fg-0);
    font-family: var(--font-mono);
    font-size: var(--type-sm);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  /* Two-tone focus ring: 1px ink + 2px accent — survives both bg-0 and accent-tint surfaces */
  .ab :focus-visible,
  .ab :focus-visible > * { outline: 2px solid var(--fg-0); outline-offset: 1px; box-shadow: var(--shadow-focus); }
  .ab button { font-family: inherit; cursor: pointer; }
  .ab a { color: inherit; text-decoration: none; }

  /* Visually-hidden — for skip link, sr-only labels */
  .ab .sr {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .ab .skip {
    position: absolute;
    top: -40px;
    left: 8px;
    z-index: 50;
    padding: 8px 14px;
    background: var(--fg-0);
    color: var(--bg-0);
    font-family: var(--font-mono);
    font-size: var(--type-sm);
    font-weight: 700;
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    border: 1px solid var(--fg-0);
  }
  .ab .skip:focus { top: 8px; }

  /* Per-artboard SKU strip — wear the DS-0X · LABEL inside the frame */
  .ab-sku {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px var(--space-5);
    background: var(--bg-2);
    border-bottom: 1px solid var(--border-strong);
    font-size: var(--type-xs);
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    color: var(--fg-1);
    flex-shrink: 0;
  }
  .ab-sku b { color: var(--fg-0); font-weight: 700; }
  .ab-sku .right { display: flex; gap: var(--space-5); color: var(--fg-2); }
  .ab-sku .right .ok { color: var(--status-success); }

  /* ─── Top chrome — shared across landing + docs ────────────────────── */
  .nav {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: var(--space-6);
    padding: 0 var(--space-7);
    height: 60px;
    background: var(--bg-0);
    border-bottom: 1px solid var(--border-strong);
    font-family: var(--font-mono);
    flex-shrink: 0;
    position: relative;
    z-index: 5;
  }
  .nav-brand {
    display: flex;
    align-items: baseline;
    gap: var(--space-4);
  }
  .nav-brand .wm {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: var(--type-md);
    color: var(--fg-0);
    letter-spacing: var(--tracking-tight);
  }
  .nav-brand .sku {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid var(--accent);
    background: var(--accent-tint);
  }
  .nav-links {
    display: flex;
    gap: var(--space-6);
    justify-self: start;
    margin-left: var(--space-6);
  }
  .nav-links a {
    font-size: var(--type-sm);
    color: var(--fg-1);
    text-transform: uppercase;
    letter-spacing: var(--tracking-sku);
    padding: 12px 0;
    border-bottom: 1px solid transparent;
  }
  .nav-links a.active { color: var(--fg-0); border-bottom-color: var(--accent); }
  .nav-tools { display: flex; align-items: center; gap: var(--space-4); }
  .nav-search {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    background: var(--bg-1);
    border: 1px solid var(--border-default);
    padding: 9px 10px;
    width: 280px;
    font-size: var(--type-xs);
    color: var(--fg-1);
  }
  .nav-search .glyph { color: var(--fg-2); }
  .nav-search .kbd {
    margin-left: auto;
    padding: 2px 6px;
    background: var(--bg-2);
    border: 1px solid var(--border-default);
    font-size: 10px;
    color: var(--fg-0);
    letter-spacing: var(--tracking-sku);
    font-weight: 600;
  }
  .nav-theme {
    display: flex;
    border: 1px solid var(--border-default);
  }
  .nav-theme button {
    background: var(--bg-0);
    border: 0;
    padding: 9px 12px;
    font-size: 10px;
    color: var(--fg-1);
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    font-weight: 600;
    min-height: 36px;
  }
  .nav-theme button.active { background: var(--fg-0); color: var(--bg-0); }
  .nav-theme button + button { border-left: 1px solid var(--border-default); }

  /* ─── Landing surface ──────────────────────────────────────────────── */
  .land {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg-0);
  }
  .land-hero {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--space-7);
    align-items: end;
    padding: var(--space-7) var(--space-7) var(--space-6);
    border-bottom: 1px solid var(--border-strong);
  }
  .land-hero-eyebrow {
    font-size: 10px;
    font-weight: 700;
    color: var(--fg-1);
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    display: flex;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }
  .land-hero-eyebrow .stamp {
    color: var(--accent);
    border: 1px solid var(--accent);
    background: var(--accent-tint);
    padding: 1px 6px;
    font-weight: 700;
  }
  .land-hero h1 {
    font-family: var(--font-display);
    font-size: var(--type-3xl);
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: var(--tracking-tight);
    color: var(--fg-0);
    margin: 0 0 var(--space-3);
    max-width: 22ch;
  }
  .land-hero .punchline {
    display: inline-block;
    margin: 0 0 var(--space-5);
    padding: 4px 10px;
    background: var(--fg-0);
    color: var(--bg-0);
    font-family: var(--font-mono);
    font-size: var(--type-xs);
    font-weight: 700;
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
  }
  .land-hero .punchline .acc { color: var(--accent); }
  .land-hero p {
    font-size: var(--type-md);
    line-height: var(--lh-md);
    color: var(--fg-1);
    margin: 0 0 var(--space-4);
    max-width: 62ch;
  }
  .land-hero p code {
    font-weight: 600;
    color: var(--fg-0);
    background: var(--mono-cell-bg);
    padding: 1px 5px;
    border: 1px solid var(--mono-rule);
  }
  .land-hero .cta-row {
    display: flex;
    gap: var(--space-3);
    margin-top: var(--space-5);
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 16px;
    font-family: var(--font-mono);
    font-size: var(--type-md);
    font-weight: 700;
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    border: 1px solid var(--fg-0);
    background: var(--fg-0);
    color: var(--bg-0);
    cursor: pointer;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    gap: var(--space-3);
  }
  .btn.ghost { background: var(--bg-0); color: var(--fg-0); }
  .btn.accent { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
  .btn.bmac { background: var(--bg-0); color: var(--accent); border: 1px solid var(--accent); }
  .btn.bmac:hover { background: var(--accent); color: var(--accent-fg); }
  .btn.bmac .stamp {
    padding: 1px 5px;
    background: var(--accent-tint);
    border: 1px solid currentColor;
    color: var(--accent);
    font-size: 9px;
    line-height: 1.1;
    font-weight: 700;
  }
  .btn.bmac:hover .stamp { background: var(--bg-0); }

  /* Install snippet — sits to right of hero copy */
  .land-snippet {
    width: 380px;
    background: var(--mono-cell-bg);
    border: 1px solid var(--border-strong);
    box-shadow: 4px 4px 0 var(--fg-0);
    font-family: var(--font-mono);
    font-size: var(--type-sm);
    color: var(--fg-0);
  }
  .land-snippet .hd {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border-strong);
    font-size: 10px;
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    color: var(--fg-1);
  }
  .land-snippet .hd b { color: var(--fg-0); font-weight: 700; }
  .land-snippet .hd .copy {
    background: transparent;
    border: 0;
    color: var(--fg-0);
    font-size: 10px;
    letter-spacing: var(--tracking-sku);
    padding: 4px 6px;
    font-weight: 600;
    min-height: 28px;
  }
  .land-snippet pre {
    margin: 0;
    padding: var(--space-4) var(--space-5);
    font-family: var(--font-mono);
    font-size: var(--type-sm);
    line-height: 22px;
    color: var(--mono-cell-fg);
    white-space: pre;
  }
  .land-snippet pre .cmt { color: var(--fg-2); }
  .land-snippet pre .acc { color: var(--accent); font-weight: 700; }
  .land-snippet pre .prompt { color: var(--fg-2); }

  /* SKU catalog grid — overlapping 1px borders trick */
  .land-catalog {
    flex: 1;
    padding: var(--space-7) var(--space-7) var(--space-6);
    background: var(--bg-1);
    overflow: hidden;
  }
  .land-catalog-hd {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: var(--space-5);
    font-family: var(--font-mono);
  }
  .land-catalog-hd h2 {
    font-size: var(--type-lg);
    font-weight: 700;
    font-family: var(--font-display);
    color: var(--fg-0);
    margin: 0;
    letter-spacing: var(--tracking-tight);
  }
  .land-catalog-hd .num {
    font-size: var(--type-xs);
    color: var(--fg-2);
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }
  .grid > * {
    margin: -1px 0 0 -1px;
    background: var(--bg-0);
    border: 1px solid var(--border-strong);
    padding: var(--space-5) var(--space-5) var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    position: relative;
  }
  .pcard .row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    color: var(--fg-1);
    font-weight: 600;
  }
  .pcard .row1 .sku { color: var(--accent-active); font-weight: 700; }
  .pcard .row1 .ver {
    padding: 2px 6px;
    background: var(--bg-2);
    border: 1px solid var(--border-default);
    color: var(--fg-0);
    font-weight: 600;
  }
  .pcard h3 {
    font-family: var(--font-display);
    font-size: var(--type-xl);
    font-weight: 700;
    letter-spacing: var(--tracking-tight);
    color: var(--fg-0);
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: var(--space-3);
  }
  .pcard h3 code {
    font-size: var(--type-md);
    font-weight: 700;
    color: var(--accent);
    background: transparent;
    border: 0;
    padding: 0;
  }
  .pcard p .acc {
    background: transparent;
    border: 0;
    color: var(--accent-active);
    font-weight: 700;
    padding: 0;
  }
  .pcard p {
    margin: 0;
    font-size: var(--type-sm);
    line-height: var(--lh-sm);
    color: var(--fg-1);
  }
  .pcard .tags {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    font-size: 10px;
    color: var(--fg-2);
    letter-spacing: var(--tracking-wide);
    text-transform: uppercase;
  }
  .pcard .tags span {
    padding: 2px 6px;
    border: 1px solid var(--border-default);
    color: var(--fg-1);
    font-weight: 600;
  }
  .pcard .install {
    margin-top: var(--space-3);
    background: var(--bg-2);
    border: 1px solid var(--border-default);
    padding: 7px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-0);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-3);
    min-height: 34px;
  }
  .pcard .install code { font-family: var(--font-mono); color: var(--accent); font-weight: 700; }
  .pcard .install .copy {
    background: transparent;
    border: 0;
    font-size: 10px;
    color: var(--fg-1);
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    padding: 4px 6px;
    font-weight: 700;
    min-height: 28px;
  }
  .pcard .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: var(--fg-1);
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    font-weight: 600;
  }
  .pcard .foot a { color: var(--accent-active); font-weight: 700; padding: 4px 0; }

  /* Meta footer */
  .land-foot {
    border-top: 1px solid var(--border-strong);
    padding: var(--space-5) var(--space-7);
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    font-size: 10px;
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    color: var(--fg-1);
    background: var(--bg-0);
    flex-shrink: 0;
    font-weight: 600;
  }
  .land-foot .meta { display: flex; gap: var(--space-5); }
  .land-foot .meta b { color: var(--fg-0); font-weight: 700; }
  .land-foot .meta .ok { color: var(--status-success); }
  .land-foot a { color: var(--fg-0); font-weight: 700; padding: 4px 0; }
  /* Buy me a coffee — discrete catalog link with accent ink-stamp prefix */
  .land-foot a.bmac {
    display: inline-flex;
    align-items: center;
    gap: var(--space-3);
    color: var(--accent-active);
    border: 1px solid var(--accent-active);
    padding: 4px 10px;
    font-weight: 700;
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    font-size: 10px;
  }
  .land-foot a.bmac:hover { background: var(--accent-active); color: var(--accent-fg); }
  .land-foot a.bmac:hover .bmac-stamp { color: inherit; border-color: currentColor; }
  .land-foot a.bmac .bmac-stamp {
    display: inline-block;
    padding: 1px 5px;
    border: 1px solid var(--accent-active);
    color: var(--accent-active);
    background: var(--bg-0);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: var(--tracking-sku);
    line-height: 1.1;
  }

  /* ─── Docs surface — 3-pane shell ──────────────────────────────────── */
  .docs {
    flex: 1;
    display: grid;
    grid-template-columns: 256px 1fr 220px;
    overflow: hidden;
    background: var(--bg-0);
  }
  .doc-side {
    border-right: 1px solid var(--border-default);
    background: var(--bg-1);
    overflow-y: auto;
    padding: var(--space-5) 0 var(--space-7);
    font-family: var(--font-mono);
    font-size: var(--type-sm);
  }
  .doc-side .ver {
    margin: 0 var(--space-5) var(--space-5);
    padding: 8px 10px;
    border: 1px solid var(--border-default);
    background: var(--bg-0);
    font-size: 10px;
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    color: var(--fg-1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    min-height: 32px;
  }
  .doc-side .ver b { color: var(--fg-0); font-weight: 700; }
  .doc-side .ver .arr { color: var(--fg-1); }
  .doc-side section { margin-bottom: var(--space-5); }
  .doc-side h4 {
    margin: 0 var(--space-5) var(--space-3);
    font-size: 10px;
    letter-spacing: var(--tracking-sku);
    text-transform: uppercase;
    color: var(--fg-1);
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .doc-side h4 .sku { color: var(--accent-active); }
  .doc-side ul { list-style: none; margin: 0; padding: 0; }
  .doc-side li a {
    display: block;
    padding: 7px var(--space-5) 7px calc(var(--space-5) + 12px);
    color: var(--fg-1);
    border-left: 1px solid transparent;
    font-size: var(--type-sm);
    line-height: 18px;
  }
  .doc-side li a:hover { background: var(--bg-2); color: var(--fg-0); }
  .doc-side li.active a {
    color: var(--accent-active);
    font-weight: 700;
    border-left-color: var(--accent-active);
    background: var(--bg-0);
  }
  .doc-side li.nested a { padding-left: calc(var(--space-5) + 24px); color: var(--fg-1); font-size: 11px; }

  .doc-main {
    overflow-y: auto;
    padding: var(--space-6) var(--space-7) var(--space-7);
    background: var(--bg-0);
  }
  .doc-crumb {
    display: flex;
    align-items: baseline;
    gap: var(--space-3);
    font-size: var(--type-xs);
    color: var(--fg-1);
    text-transform: uppercase;
    letter-spacing: var(--tracking-sku);
    margin-bottom: var(--space-4);
    font-weight: 600;
  }
  .doc-crumb a { color: var(--fg-1); padding: 4px 0; }
  .doc-crumb a:hover { color: var(--fg-0); }
  .doc-crumb .sep { color: var(--fg-2); }
  .doc-crumb .cur { color: var(--fg-0); font-weight: 700; }
  .doc-crumb .sku-tail {
    margin-left: auto;
    color: var(--accent-active);
    font-weight: 700;
  }
  .doc-h1 {
    font-family: var(--font-display);
    font-size: var(--type-3xl);
    font-weight: 700;
    letter-spacing: var(--tracking-tight);
    line-height: 1.1;
    color: var(--fg-0);
    margin: 0 0 var(--space-3);
  }
  .doc-lede {
    font-size: var(--type-md);
    line-height: var(--lh-md);
    color: var(--fg-1);
    max-width: 72ch;
    margin: 0 0 var(--space-5);
  }
  .doc-lede code {
    background: var(--mono-cell-bg);
    border: 1px solid var(--mono-rule);
    padding: 1px 5px;
    color: var(--fg-0);
    font-weight: 600;
  }
  .doc-h2 {
    font-family: var(--font-display);
    font-size: var(--type-lg);
    font-weight: 700;
    letter-spacing: var(--tracking-tight);
    color: var(--fg-0);
    margin: var(--space-6) 0 var(--space-3);
    padding-bottom: var(--space-3);
    border-bottom: 1px solid var(--border-strong);
    display: flex;
    align-items: baseline;
    gap: var(--space-4);
    position: relative;
  }
  .doc-h2 .num {
    font-family: var(--font-mono);
    font-size: var(--type-sm);
    color: var(--accent);
    font-weight: 700;
    letter-spacing: var(--tracking-sku);
  }
  .doc-h2 .hash {
    position: absolute;
    left: -22px;
    color: var(--fg-2);
    font-weight: 400;
    font-size: var(--type-md);
  }
  .doc-h3 {
    font-family: var(--font-mono);
    font-size: var(--type-md);
    font-weight: 600;
    color: var(--fg-0);
    margin: var(--space-5) 0 var(--space-3);
  }
  .doc-p {
    font-size: var(--type-base);
    line-height: var(--lh-base);
    color: var(--fg-1);
    max-width: 72ch;
    margin: 0 0 var(--space-4);
  }
  .doc-p code {
    background: var(--mono-cell-bg);
    border: 1px solid var(--mono-rule);
    padding: 1px 5px;
    color: var(--fg-0);
    font-weight: 600;
    white-space: nowrap;
  }
  .doc-p a { color: var(--accent-active); border-bottom: 1px solid var(--accent-active); font-weight: 600; }
  .doc-p a:hover { color: var(--fg-0); border-bottom-color: var(--fg-0); }

  /* Tile grid for docs index */
  .doc-tiles {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    margin: var(--space-4) 0 var(--space-6);
    max-width: 72ch;
  }
  .doc-tile {
    margin: -1px 0 0 -1px;
    border: 1px solid var(--border-default);
    padding: var(--space-4) var(--space-5);
    background: var(--bg-0);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }
  .doc-tile .sku {
    font-size: 10px;

          <h1 className="doc-h1">/design:new</h1>
          <p className="doc-lede">
            Scaffold a new multi-artboard canvas file in <code>&lt;designRoot&gt;/&lt;newCanvasDir&gt;/&lt;Name&gt;.html</code>.
            Default mode is <code>--perfect</code> — full critic panel, up to 8 fix iterations, target 4.5/5
            aspiration score. Opt out with <code>--quick</code> or <code>--no-critic</code>.
          </p>

          <h2 id="what-it-does" className="doc-h2"><span className="hash">#</span><span className="num">01</span><span>What it does</span></h2>
          <p className="doc-p">
            <code>/design:new</code> is the entry-point for a new canvas project. A canvas project is one
            <code>DesignCanvas</code> wrapper containing one or more <code>DCSection</code>, each holding one or
            more <code>DCArtboard</code>. Single-page HTML wrappers are an anti-pattern; a new screen should be
            added as another <code>DCArtboard</code> to an existing canvas via
            <code>/design:edit "&lt;add new artboard for X&gt;"</code>, not via this command.
          </p>
          <p className="doc-p">
            The command is delegated to the <code>frontend-design</code> skill when available — see
            <a href="/docs/design/skills/frontend-design">skills/frontend-design</a> for the generation envelope contract.
            On generation failure the orchestrator falls back to direct generation and surfaces the fact in the
            final print (no silent downgrade).
          </p>

          <h2 id="usage" className="doc-h2"><span className="hash">#</span><span className="num">02</span><span>Usage</span></h2>

          <div className="cblock">
            <div className="cblock-hd">
              <div className="cblock-tabs">
                <button type="button" className="cblock-tab active">SIGNATURE</button>
              </div>
              <div className="cblock-tools">
                <span className="lang">BASH</span>
                <button type="button" className="copy">COPY</button>
              </div>
            </div>
            <pre>
<span className="acc">/design:new</span> <span className="str">"&lt;Name&gt;"</span> <span className="str">"&lt;brief&gt;"</span> <span className="cmt">\</span>{"\n"}
  [<span className="key">--component</span>] [<span className="key">--mobile</span>] <span className="cmt">\</span>{"\n"}
  [<span className="key">--quick</span> | <span className="key">--no-critic</span>] [<span className="key">--perfect-iter</span> N] <span className="cmt">\</span>{"\n"}
  [<span className="key">--ds</span>=&lt;name&gt;] [<span className="key">--opt-out</span>=palette|aesthetic|full]
            </pre>
          </div>

          <h3 id="perfect-mode" className="doc-h3">--perfect mode (default)</h3>
          <p className="doc-p">
            Initial scaffold sets the canvas trajectory for every future <code>/design:edit</code>; cheap to leave
            unpolished, expensive to refactor backwards. So the critic panel is always-on, always-full, always
            targeting portfolio-grade output.
          </p>

          <div className="callout warn">
            <div className="ico">!</div>
            <div className="body">
              <span className="label">TOKEN COST · 150–300K</span>
              <code>--perfect</code> spawns up to 8 critic iterations across a minimum 4-agent panel —
              roughly <b style={{color:"var(--fg-0)"}}>40+ subagent calls</b> per invocation, totalling
              <b style={{color:"var(--fg-0)"}}>~150–300k tokens</b> and 5–15 min wall time. If your session context is already
              60%+ full the orchestrator surfaces a confirmation question before starting the loop — never silently
              downgrades. Opt out explicitly with <code>--quick</code> (single critic, 2 iterations) or
              <code>--no-critic</code> (skip the loop entirely).
            </div>
          </div>

          <h3 id="opt-out-scope" className="doc-h3">Opt-out scopes</h3>
          <p className="doc-p">
            <code>--opt-out=palette</code> (default) keeps the tokens link + <code>rootClass</code> envelope but
            allows a local namespaced palette override. <code>aesthetic</code> additionally permits gradients,
            off-ladder radii, alt type pairings, and decorative SVGs.
            <code>full</code> treats the design system as advisory. Accessibility is enforced at every scope
            regardless — WCAG AA never downgrades.
          </p>

          <h2 id="options" className="doc-h2"><span className="hash">#</span><span className="num">03</span><span>Options</span></h2>
          <p className="doc-p">
            All flags can be combined. <code>--component</code> writes a JSX component to <code>newComponentDir</code> instead
            of an HTML canvas to <code>newCanvasDir</code>. <code>--mobile</code> hints mobile chrome to the generation
            envelope; auto-detected when <code>&lt;Name&gt;</code> contains "Mobile", "iOS", or "Android".
          </p>

          <div className="callout tip">
            <div className="ico">i</div>
            <div className="body">
              <span className="label">RECOMMENDED</span>
              For exploration where you only want to see if a layout pencils out, pass <code>--quick</code>. For
              dialed-in production designs leave <code>--perfect</code> default-on. The cost is real — but so is the
              quality delta. Mid-range work (4–6 fix iterations) is what <code>--perfect-iter</code> exists for.
            </div>
          </div>

          <h2 id="examples" className="doc-h2"><span className="hash">#</span><span className="num">04</span><span>Examples</span></h2>

          <div className="cblock">
            <div className="cblock-hd">
              <div className="cblock-file"><b>terminal</b> · inside Claude Code</div>
              <div className="cblock-tools">
                <span className="lang">BASH</span>
                <button type="button" className="copy ok">✓ COPIED</button>
              </div>
            </div>
            <pre>
<span className="cmt"># default — full --perfect loop, 4 artboards, desktop</span>{"\n"}
<span className="prompt">›</span> <span className="acc">/design:new</span> <span className="str">"Match Recap"</span> \{"\n"}
    <span className="str">"3 artboards: hero stat card, key moments timeline, share/embed"</span>{"\n"}
{"\n"}
<span className="cmt"># quick — exploration, 1 critic, max 2 fix iter</span>{"\n"}
<span className="prompt">›</span> <span className="acc">/design:new</span> <span className="str">"Scout Radar"</span> <span className="str">"radar sweep finder"</span> <span className="key">--quick</span>{"\n"}
{"\n"}
<span className="cmt"># mobile + scoped opt-out for off-system exploration</span>{"\n"}
<span className="prompt">›</span> <span className="acc">/design:new</span> <span className="str">"iOS Signup"</span> <span className="str">"5-step flow"</span> <span className="key">--mobile</span> <span className="key">--opt-out=aesthetic</span>{"\n"}
{"\n"}
<span className="cmt"># component instead of full canvas, lands in newComponentDir</span>{"\n"}
<span className="prompt">›</span> <span className="acc">/design:new</span> MatchRecap <span className="str">"stat-card React component"</span> <span className="key">--component</span>
            </pre>
          </div>

          <h2 id="related" className="doc-h2"><span className="hash">#</span><span className="num">05</span><span>Related commands</span></h2>
