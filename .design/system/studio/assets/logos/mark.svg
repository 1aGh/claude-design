<!--
  studio mark — plasma square + amber inset rotated 45°.
  OKLCH source values, kept literal so the asset renders outside the design-system context (favicon, npm registry, GitHub avatar).

  - plasma:       oklch(68% 0.22 285)   ≈ #8466e6
  - amber:        oklch(64% 0.18 50)    ≈ #c87b3d
  - amber-fg:     oklch(14% 0.05 50)    ≈ #1f1409

  If you change --accent or --brand-amber in colors_and_type.css, re-export this asset.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="studio mark">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="plasma-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="oklch(72% 0.22 285)"/>
      <stop offset="100%" stop-color="oklch(60% 0.22 285)"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="11" fill="url(#plasma-grad)" filter="url(#glow)"/>
  <g transform="translate(32 32) rotate(45) translate(-12 -12)">
    <rect width="24" height="24" rx="3" fill="oklch(64% 0.18 50)"/>
  </g>
</svg>
