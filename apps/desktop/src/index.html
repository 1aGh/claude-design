<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maude</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0b0c;
        color: #e7e7ea;
        font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        user-select: none;
      }
      .wordmark { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
      .status { color: #8a8a92; font-size: 13px; }
      .spinner {
        width: 22px; height: 22px;
        border: 2px solid #2a2a2e;
        border-top-color: #e7e7ea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main class="splash">
      <div class="spinner" aria-hidden="true"></div>
      <div class="wordmark">Maude</div>
      <div class="status">Starting…</div>
    </main>
  </body>
</html>
