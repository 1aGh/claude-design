name: Docs issue
description: Something in the docs is wrong, missing, or unclear.
title: "docs: <short summary>"
labels: ["type:docs", "needs:triage"]
body:
  - type: input
    id: location
    attributes:
      label: Where?
      description: File path or URL.
      placeholder: "README.md (Local development section) / docs site /flow:setup-onboard page"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
      description: A sentence, a paragraph, or a draft PR — whatever you have.
    validations:
      required: false
