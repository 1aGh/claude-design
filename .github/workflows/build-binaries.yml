name: Build per-platform binaries

# Phase 3.4 / DDR-015 — build mdcc dev-server as a Bun standalone binary on each
# target platform, publish the matching @1agh/md-claude-<slug> sub-package, then
# (once every binary is uploaded) publish the main @1agh/md-claude tarball.
#
# Trigger on the same v*.*.* tag as the main publish workflow. The main publish
# job (`publish.yml`) is gated on `needs: build-binaries.publish-main`, so a
# failing binary build aborts the whole release before npm sees anything.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (build but do not publish)'
        type: boolean
        default: false

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            slug: darwin-arm64
            ext: ''
          - os: macos-13
            target: bun-darwin-x64
            slug: darwin-x64
            ext: ''
          - os: ubuntu-22.04
            target: bun-linux-x64
            slug: linux-x64
            ext: ''
          - os: ubuntu-22.04-arm
            target: bun-linux-arm64
            slug: linux-arm64
            ext: ''
          - os: ubuntu-22.04
            target: bun-linux-x64-musl
            slug: linux-x64-musl
            ext: ''
          - os: ubuntu-22.04-arm
            target: bun-linux-arm64-musl
            slug: linux-arm64-musl
            ext: ''
          - os: windows-2022
            target: bun-windows-x64
            slug: win32-x64
            ext: '.exe'
    # musl targets are cross-compiled from regular glibc ubuntu runners via
    # `bun build --compile --target=bun-linux-*-musl` — bun produces statically
    # linked binaries that don't depend on the host's libc. Previously we ran
    # inside an `alpine:3.20` container, but GitHub Actions can't run JS-based
    # actions (actions/checkout, setup-bun) inside alpine on arm64 runners
    # ("JavaScript Actions in Alpine containers are only supported on x64 Linux
    # runners").
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.x'

      - name: Build binary for ${{ matrix.target }}
        shell: bash
        run: |
          cd plugins/design/dev-server
          bun install --frozen-lockfile
          bun run build.ts --release --target=${{ matrix.target }}
          ls -la dist/
          BIN="dist/mdcc-${{ matrix.slug }}${{ matrix.ext }}"
          if [ ! -f "$BIN" ]; then
            echo "error: expected $BIN not produced" >&2
            exit 1
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "binary size:" && du -h "$BIN"

      - name: Smoke-test binary
        shell: bash
        run: |
          cd plugins/design/dev-server
          # The dev-server fails loud without a .design/ directory — that's
          # enough to prove the binary executes.
          ./${{ env.BIN }} --root /tmp/nonexistent || echo "expected fail-loud exit code"

      - name: Stage sub-package contents
        shell: bash
        run: |
          DEST="packages/md-claude-${{ matrix.slug }}"
          cp "plugins/design/dev-server/${{ env.BIN }}" "$DEST/mdcc${{ matrix.ext }}"
          chmod +x "$DEST/mdcc${{ matrix.ext }}" || true
          ls -la "$DEST"

      - name: Publish sub-package
        if: github.event_name == 'push' || inputs.dry-run != true
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/md-claude-${{ matrix.slug }}
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --access public --provenance

      - name: Dry-run sub-package
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        shell: bash
        run: |
          cd packages/md-claude-${{ matrix.slug }}
          npm publish --access public --provenance --dry-run

      - name: Upload binary as Release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "plugins/design/dev-server/${{ env.BIN }}" --clobber || true

  publish-main:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        # --no-frozen-lockfile: optionalDependencies on the freshly-published
        # @1agh/md-claude-<slug>@$VER packages only resolve after the matrix
        # above pushes them to npm. A frozen lockfile cannot enumerate
        # specifiers that didn't exist when the lockfile was last written.
        # The release tag is the integrity boundary; quality.yml runs against
        # the same `--no-frozen-lockfile` (lockfile is still respected when
        # entries are present).
        run: pnpm install --no-frozen-lockfile

      - name: Verify version parity
        run: bash scripts/check-version-parity.sh

      - name: Build
        run: pnpm build

      - name: Verify tarball shape
        run: bash scripts/check-tarball-shape.sh

      - name: Publish main tarball
        if: github.event_name == 'push' || inputs.dry-run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Dry-run main tarball
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: npm publish --access public --provenance --dry-run
