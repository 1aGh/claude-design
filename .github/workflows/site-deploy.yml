name: site — deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'plugins/flow/commands/**' # command-reference auto-gen depends on these
      - 'plugins/design/commands/**'
      - 'plugins/flow/.claude-plugin/config.schema.json'
      - '.github/workflows/site-deploy.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'plugins/flow/commands/**'
      - 'plugins/design/commands/**'
      - 'plugins/flow/.claude-plugin/config.schema.json'

permissions:
  contents: read
  deployments: write

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Required repo secrets (set in GitHub → Settings → Secrets and variables → Actions):
  #   VERCEL_TOKEN       — Personal token from https://vercel.com/account/tokens
  #   VERCEL_ORG_ID      — From `vercel link` output (.vercel/project.json)
  #   VERCEL_PROJECT_ID  — Same source
  # Until these are set, the workflow runs but the deploy steps will fail
  # loudly. See `.ai/decisions/DDR-005-docs-site-stack-and-hosting.md`.
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + lint the site
        run: |
          pnpm --filter @md-claude/site lint
          pnpm --filter @md-claude/site build

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: pnpm dlx vercel@latest --version

      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != ''
        run: |
          pnpm dlx vercel@latest pull --yes \
            --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} \
            --token="$VERCEL_TOKEN" \
            site
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Build (Vercel)
        if: env.VERCEL_TOKEN != ''
        run: |
          pnpm dlx vercel@latest build \
            ${{ github.event_name == 'push' && '--prod' || '' }} \
            --token="$VERCEL_TOKEN" \
            site

      - name: Deploy (Vercel)
        if: env.VERCEL_TOKEN != ''
        id: deploy
        run: |
          URL=$(pnpm dlx vercel@latest deploy --prebuilt \
            ${{ github.event_name == 'push' && '--prod' || '' }} \
            --token="$VERCEL_TOKEN" \
            site)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != '' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📚 **Docs preview:** ${url}`,
            });

      - name: Skip notice
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::warning::VERCEL_TOKEN not set — build verified but no deploy."
          echo "See .ai/decisions/DDR-005-docs-site-stack-and-hosting.md for setup."
