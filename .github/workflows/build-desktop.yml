name: Build desktop app (macOS .dmg + Windows .msi + Linux .AppImage/.deb)

# Phase 26 / DDR-106 — build the Maude native shell (Tauri v2) into installers.
# Phase 32 / Task 2 — extended to a macOS + Windows matrix with auto-update
# artifacts. Linux (.AppImage + .deb) added as a third leg — Tauri renders the
# UI through WebKitGTK there (not WKWebView/WebView2), and the leg installs the
# WebKitGTK 4.1 toolchain before `tauri build`. Linux has no Gatekeeper/
# SmartScreen, so the bundle is unsigned by design (only the ed25519 updater
# signature is applied — AppImage self-update still verifies; .deb does not
# self-update). Sidecar binaries for linux-x64 already ship from
# build-binaries.yml, and the /releases feed already routes the `linux` target.
#
# Each leg bundles the compiled dev-server binary as a Tauri sidecar. Build order
# is load-bearing: the dev-server binary must exist at apps/studio/dist/maude-<slug>
# BEFORE `tauri build` runs, because the desktop app's `beforeBuildCommand`
# (scripts/sync-sidecar.mjs) copies it into src-tauri/binaries/maude-server-<triple>
# for Tauri's `externalBin`.
#
# Two signing keys are in play (Phase 32):
#   • TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) — ed25519 key that signs the UPDATER
#     artifacts (createUpdaterArtifacts:true). The matching public key is pinned in
#     tauri.conf.json → plugins.updater.pubkey; the client refuses an update whose
#     signature doesn't verify. Required on BOTH legs for auto-update to work.
#   • Platform code-signing — APPLE_* (macOS notarization) / WINDOWS_CERTIFICATE
#     (Authenticode). When absent the build still succeeds and produces an UNSIGNED
#     installer (dev distribution); SmartScreen/Gatekeeper will warn. This mirrors
#     the phase-26 graceful-degradation contract.
#
# MAUDE_SKIP_RUNTIME_BUILD=1 is mandatory (per CLAUDE.md): embed the git-committed
# dist/runtime/*.js verbatim instead of regenerating them.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # attach installers + updater artifacts to the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64; matches build-binaries.yml's darwin-arm64 host
            label: macos-arm64
            target: bun-darwin-arm64
            sidecar_slug: darwin-arm64
            sidecar_dist: dist/maude-darwin-arm64
            artifact_name: maude-desktop-macos-arm64
            bundle_glob: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-2022
            label: windows-x64
            target: bun-windows-x64
            sidecar_slug: win32-x64
            sidecar_dist: dist/maude-win32-x64.exe
            artifact_name: maude-desktop-windows-x64
            bundle_glob: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04 # oldest supported runner = widest glibc baseline for the AppImage
            label: linux-x64
            target: bun-linux-x64
            sidecar_slug: linux-x64
            sidecar_dist: dist/maude-linux-x64
            artifact_name: maude-desktop-linux-x64
            bundle_glob: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace deps
        # --no-frozen-lockfile: the optionalDependencies bootstrap pins the 7
        # @1agh/maude-<platform> sub-packages at the release version, which the
        # committed lockfile can't enumerate until the build-binaries matrix
        # publishes them (mirrors build-binaries.yml > publish-main + vercel.json).
        run: pnpm install --no-frozen-lockfile

      - name: Build dev-server sidecar binary
        # Embed the committed dist/runtime/*.js verbatim (MAUDE_SKIP_RUNTIME_BUILD=1).
        shell: bash
        env:
          MAUDE_SKIP_RUNTIME_BUILD: '1'
        run: |
          cd apps/studio
          bun install
          bun run build.ts --release --target=${{ matrix.target }}
          test -f "${{ matrix.sidecar_dist }}" || { echo "::error::dev-server binary not produced at apps/studio/${{ matrix.sidecar_dist }}"; ls -la dist; exit 1; }

      # ── macOS: build + notarize (when APPLE_* present) ──────────────────────────
      - name: Build Tauri app (.dmg)
        if: matrix.os == 'macos-14'
        env:
          MAUDE_SIDECAR_SLUG: ${{ matrix.sidecar_slug }}
          # Updater signing (ed25519) — produces the .app.tar.gz.sig the feed serves.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code-signing + notarization (absent → unsigned .dmg).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # Graceful-degradation: with no Apple cert secret configured the env
          # vars above arrive as EMPTY STRINGS (not unset), which still makes
          # tauri's macOS bundler attempt `security import` on an empty cert and
          # fail ("failed to import keychain certificate"). Unset them so tauri
          # ad-hoc-signs an UNSIGNED .dmg (dev distribution) instead. Updater
          # signing (TAURI_SIGNING_PRIVATE_KEY) is unaffected.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          pnpm --filter @maude/desktop tauri build

          # tauri notarizes + staples the .app, but only *signs* the .dmg
          # container (it is NOT notarized). A browser-downloaded (quarantined)
          # unnotarized dmg still trips Gatekeeper on mount ("Apple cannot check
          # it for malicious software"), so notarize + staple the dmg itself.
          # Only in the signed path — the unset above clears APPLE_CERTIFICATE
          # in the unsigned/dev path, so this is skipped there.
          if [ -n "$APPLE_CERTIFICATE" ]; then
            DMG=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
            echo "Notarizing dmg container: $DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
          fi

      # ── Windows: build + Authenticode sign (when WINDOWS_CERTIFICATE present) ────
      - name: Build Tauri app (.msi)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        env:
          MAUDE_SIDECAR_SLUG: ${{ matrix.sidecar_slug }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            Write-Host "Importing Authenticode certificate from WINDOWS_CERTIFICATE"
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            [IO.File]::WriteAllBytes("$PWD\cert.pfx", $bytes)
            $securePwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath "$PWD\cert.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $securePwd
            Remove-Item "$PWD\cert.pfx"
            # Inject the thumbprint via a --config override (avoids committing it).
            $signConf = @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
            } } } | ConvertTo-Json -Depth 6
            Set-Content -Path "apps/desktop/sign.conf.json" -Value $signConf
            pnpm --filter @maude/desktop tauri build --config sign.conf.json
          } else {
            Write-Host "WINDOWS_CERTIFICATE not set — producing an UNSIGNED .msi"
            pnpm --filter @maude/desktop tauri build
          }

      # ── Linux: install the WebKitGTK toolchain, then build (.AppImage + .deb) ────
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Tauri v2's documented Ubuntu prerequisites. webkit2gtk-4.1 is the v2
          # webview (4.0 is v1); libayatana-appindicator3 backs the tray; patchelf
          # + librsvg are needed by the AppImage bundler. libfuse2 lets the
          # linuxdeploy AppImage tooling FUSE-mount (GitHub runners ship FUSE3,
          # not the libfuse2 the AppImage runtime needs) — belt-and-suspenders
          # alongside APPIMAGE_EXTRACT_AND_RUN below.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            patchelf \
            build-essential \
            file \
            wget

      - name: Build Tauri app (.AppImage + .deb)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          MAUDE_SIDECAR_SLUG: ${{ matrix.sidecar_slug }}
          # linuxdeploy + its plugins are themselves AppImages; on GitHub runners
          # they can't FUSE-mount, so `tauri build` dies with the opaque
          # "failed to run linuxdeploy". APPIMAGE_EXTRACT_AND_RUN makes every
          # AppImage extract to a tmpdir and run instead of mounting (FUSE-free).
          # NO_STRIP avoids the companion failure where linuxdeploy's strip pass
          # chokes on the bundled GTK/sidecar binaries.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          # Updater signing (ed25519) — produces the .AppImage.tar.gz.sig the feed
          # serves. There is no Linux code-signing equivalent of Apple/Authenticode,
          # so the bundle is unsigned by design (same graceful-degradation contract
          # as the unsigned .dmg/.msi legs).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Restrict to appimage,deb: skip the rpm target (config is targets:"all")
          # so the leg doesn't need rpmbuild tooling. AppImage carries the updater
          # artifact; .deb is the common direct-download package.
          pnpm --filter @maude/desktop tauri build --bundles appimage,deb

      - name: Locate primary installer
        id: installer
        shell: bash
        run: |
          FILE="$(ls ${{ matrix.bundle_glob }} 2>/dev/null | head -1)"
          test -n "$FILE" || { echo "::error::no installer matched ${{ matrix.bundle_glob }}"; exit 1; }
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "built: $FILE"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Attach installers + updater artifacts to GitHub Release
        # Attach the user-facing installer AND the updater artifacts (.sig + the
        # .app.tar.gz / signed installer the feed serves). The /releases edge
        # function (site/app/releases/...) reads these off the release.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
