name: Publish hub image

# Phase 9 Task 7 — build the self-hostable Maude hub as a multi-arch
# (amd64 + arm64) Docker image and push it to GHCR on every v*.*.* release tag.
#
# Image: ghcr.io/1agh/maude-hub:vX.Y.Z + :latest
# Build context is apps/hub/ — the Dockerfile is self-contained
# (no monorepo COPY), so the image builds from the hub package alone.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build only, do not push'
        type: boolean
        default: false

jobs:
  hub-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.dry-run != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "tags=ghcr.io/1agh/maude-hub:v${VER},ghcr.io/1agh/maude-hub:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/hub
          file: apps/hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.dry-run != true }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
