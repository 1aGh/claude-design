name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint+test+links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'    # pnpm 11 requires Node >=22.13 (engines.node ">=20" is the CLI runtime constraint, not the build constraint)
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Test (node:test)
        run: pnpm test

      - name: Tarball shape
        run: bash scripts/check-tarball-shape.sh

      - name: Version parity
        run: bash scripts/check-version-parity.sh
