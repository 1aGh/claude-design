packages:
  # The root package (@1agh/md-claude) is the sole npm publisher.
  # Listed here so Changesets can resolve it as a workspace member.
  - "."
  - site
  - plugins/design/dev-server
  - plugins/design/hub
# pnpm 9+ requires explicit opt-in for postinstall scripts.
# Biome ships native binaries via @biomejs/cli-* optional deps; the postinstall
# is the official install path. Enable.
allowBuilds:
  '@biomejs/biome': true
